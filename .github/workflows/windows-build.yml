name: Windows portable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[build]"
      - run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: PartageClair-windows-x64
          path: |
            dist/PartageClair-*-windows-x64.zip
            dist/PartageClair-*-windows-x64.zip.sha256
          if-no-files-found: error
